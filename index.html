<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JE.TRADEFx Journal</title>
<style>
body { font-family: Arial; background: #0d1117; color: #c9d1d9; padding: 15px; }
h1 { color: #58a6ff; text-align: center; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
th, td { border: 1px solid #30363d; padding: 8px; text-align: center; }
th { background: #161b22; color: #58a6ff; }
.profit { color: #3fb950; }
.loss { color: #f85149; }
</style>
</head>
<body>
<h2 style="text-align:center;">TRADE FX TRADING JOURNAL</h2>
<p style="text-align:center;">Data otomatis dari Google Sheet</p>

<div id="tabel-jurnal">Loading data...</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTU5UVG2QyOsCVwzLF5D39El9O3l6Dq5perIlqRyhzZygfqXK6ojR5_avK4nfriuARtr9rI2xTLCdVK/pub?output=csv";

fetch(SHEET_URL)
  .then(res => res.text())
  .then(csv => {
    const baris = csv.split('\n');
    let html = '<table border="1" style="width:100%; border-collapse:collapse; font-size:12px;">';
    
    baris.forEach((barisData, i) => {
      const kolom = barisData.split(',');
      html += '<tr>';
      kolom.forEach((sel, idx) => {
        if(i === 0) {
          html += `<th style="padding:6px; background:#007bff; color:white;">${sel}</th>`;
        } else {
          let warna = '';
          if(idx == 7 && parseFloat(sel) > 0) warna = 'style="color:green; font-weight:bold;"'; // Profit
          if(idx == 7 && parseFloat(sel) < 0) warna = 'style="color:red; font-weight:bold;"'; // Loss
          html += `<td ${warna} style="padding:6px;">${sel}</td>`;
        }
      });
      html += '</tr>';
    });
    
    html += '</table>';
    document.getElementById('tabel-jurnal').innerHTML = html;
  })
  .catch(err => document.getElementById('tabel-jurnal').innerHTML = 'Gagal memuat data');
</script>
</body>
</html>
